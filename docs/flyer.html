<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project MayDay — Flyer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        @page { size: A4 portrait; margin: 0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            font-family: 'Inter', -apple-system, sans-serif;
            background: #ffffff;
            color: #1a1d28;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page {
            text-align: center;
            padding: 20mm;
        }

        .badge {
            display: inline-block;
            font-size: 9pt;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #0f7b6c;
            background: #ecf8f6;
            border: 1px solid rgba(15, 123, 108, 0.15);
            border-radius: 100px;
            padding: 3mm 6mm;
            margin-bottom: 12mm;
        }

        h1 {
            font-size: 56pt;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1.0;
            margin-bottom: 10mm;
        }

        h1 .hl {
            background: linear-gradient(135deg, #5046e5, #0f7b6c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .blurb {
            font-size: 14pt;
            color: #6b7085;
            line-height: 1.6;
            max-width: 130mm;
            margin: 0 auto 16mm;
        }

        .divider {
            width: 40mm;
            height: 1px;
            background: #e2e4ea;
            margin: 0 auto 12mm;
        }

        .details {
            font-size: 13pt;
            color: #1a1d28;
            font-weight: 600;
            line-height: 2.0;
        }

        .details .dim {
            font-weight: 400;
            color: #6b7085;
        }

        .signup-url {
            margin-top: 14mm;
            font-size: 13pt;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            color: #5046e5;
            letter-spacing: 0.01em;
        }

        @media print {
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="badge">Hands-On Workshop</div>
    <h1>Project <span class="hl">MayDay</span></h1>
    <p class="blurb">
        An afternoon of data science, machine learning, and
        real-time experimentation. Query a live database, build a model,
        and deploy it.
    </p>
    <div class="divider"></div>
    <div class="details">
        Tuesday 5 May 2026 <span class="dim">/</span> 1:00 &ndash; 4:30 pm<br>
        <span class="dim">Dr Thomas Robinson</span>
    </div>
    <div class="signup-url">your-signup-link-here.com</div>
</div>
</body>
</html>
